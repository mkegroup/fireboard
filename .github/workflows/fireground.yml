name: Fire Ground Board

# One workflow for everything:
#  1. If a .zip of the project was uploaded, unpack it into the repo and delete the zip.
#  2. Run the security and code tests.
#  3. Deploy the backend to Supabase (skips until the Supabase secrets are set).
#  4. Deploy the web app to GitHub Pages (skips until the Supabase variables are set).
#  5. Every night, check Stripe seat counts match the real rosters.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

concurrency:
  group: fireground-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.go.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: go
        run: |
          zip=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$zip" ]; then
            echo "Unpacking $zip"
            rm -rf /tmp/fgb && mkdir -p /tmp/fgb
            unzip -q -o "$zip" -d /tmp/fgb
            src=$(dirname "$(find /tmp/fgb -path '*/web/index.html' | head -n 1)")/..
            src=$(cd "$src" && pwd)
            # Workflow files can't be changed by a workflow, so .github is skipped.
            (cd "$src" && tar --exclude=./.github --exclude=./node_modules -cf - .) | tar -xf -
            git rm -q -- "$zip"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack $zip"
            git push -q origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test-database:
    needs: unpack
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unpack.outputs.sha }}
      - name: Row level security tests
        run: |
          if [ ! -f supabase/tests/run.sh ]; then echo "::notice::Project not uploaded yet."; exit 0; fi
          bash supabase/tests/run.sh

  test-code:
    needs: unpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unpack.outputs.sha }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check functions and app scripts
        run: |
          if [ ! -d web/js ]; then echo "::notice::Project not uploaded yet."; exit 0; fi
          (cd supabase/functions && deno check */index.ts)
          for f in web/js/*.js web/sw.js; do node --check "$f"; done

  deploy-backend:
    needs: [unpack, test-database, test-code]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unpack.outputs.sha }}
      - id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Supabase secrets aren't set yet. Skipping backend deploy."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'yes'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.ready.outputs.go == 'yes'
        name: Database and functions
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          for fn in billing stripe-webhook dispatch delete-account reconcile-seats; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

  deploy-web:
    needs: [unpack, test-database, test-code]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unpack.outputs.sha }}
      - id: ready
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL and SUPABASE_ANON_KEY variables aren't set yet. Skipping web deploy."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'yes'
        name: Fill in config
        run: |
          node -e '
            const fs = require("fs"); const p = "web/js/config.js";
            let s = fs.readFileSync(p, "utf8");
            s = s.replace(/SUPABASE_URL: ".*?"/, "SUPABASE_URL: " + JSON.stringify(process.env.SUPABASE_URL.replace(/\/$/, "")));
            s = s.replace(/SUPABASE_ANON_KEY: ".*?"/, "SUPABASE_ANON_KEY: " + JSON.stringify(process.env.SUPABASE_ANON_KEY));
            if (process.env.APP_DOMAIN) s = s.replace(/APP_URL: ".*?"/, "APP_URL: " + JSON.stringify("https://" + process.env.APP_DOMAIN));
            fs.writeFileSync(p, s);
          '
          if [ -n "$APP_DOMAIN" ]; then echo "$APP_DOMAIN" > web/CNAME; fi
          sed -i "s/const VERSION = \".*\";/const VERSION = \"fgb-${GITHUB_SHA::8}\";/" web/sw.js
      - if: steps.ready.outputs.go == 'yes'
        uses: actions/configure-pages@v5
      - if: steps.ready.outputs.go == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - if: steps.ready.outputs.go == 'yes'
        uses: actions/deploy-pages@v4

  reconcile-seats:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Match Stripe seats to rosters
        env:
          URL: ${{ vars.SUPABASE_URL }}
          SECRET: ${{ secrets.RECONCILE_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "::notice::Not set up yet."; exit 0; fi
          curl -fsS -X POST "$URL/functions/v1/reconcile-seats" -H "x-reconcile-secret: $SECRET"
