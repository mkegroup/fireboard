# Builds the Fire Ground iPhone app and sends it to TestFlight.
# Set up once in Codemagic (see SETUP.md, "iPhone app"):
#   - App Store Connect API key integration named "Fire Ground" (its own key, not Scrub Club's)
#   - Environment variable group "fireground" with:
#       SUPABASE_URL, SUPABASE_ANON_KEY                     (public values, same as the website)
#       CERTIFICATE_PRIVATE_KEY                             (Fire Ground's own signing key, from fireground-signing-key.pem)
#       APP_STORE_APPLE_ID                                  (the app's Apple ID number from App Store Connect)
#       GOOGLE_MAPS_KEY  (the iPhone app's own key, see SETUP.md "Maps"), INBOX_DOMAIN (same as GitHub)
workflows:
  ios-testflight:
    name: Fire Ground iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Fire Ground
    environment:
      groups:
        - fireground
      vars:
        BUNDLE_ID: ca.mkegroup.fireground
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_DOMAIN: fire.mkegroup.ca
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Check settings
        script: |
          #!/usr/bin/env bash
          for v in SUPABASE_URL SUPABASE_ANON_KEY CERTIFICATE_PRIVATE_KEY APP_STORE_APPLE_ID; do
            if [ -z "${!v}" ]; then echo "Missing $v in the fireground environment group"; exit 1; fi
          done
      - name: Fill in app settings
        script: |
          node -e '
            const fs = require("fs"); const p = "web/js/config.js";
            let s = fs.readFileSync(p, "utf8");
            const set = (k, v) => { s = s.replace(new RegExp(k + ": \".*?\""), k + ": " + JSON.stringify(v)); };
            set("SUPABASE_URL", process.env.SUPABASE_URL.replace(/\/$/, ""));
            set("SUPABASE_ANON_KEY", process.env.SUPABASE_ANON_KEY);
            set("APP_URL", "https://" + process.env.APP_DOMAIN);
            if (process.env.GOOGLE_MAPS_KEY) set("GOOGLE_MAPS_KEY", process.env.GOOGLE_MAPS_KEY.trim());
            if (process.env.INBOX_DOMAIN) set("INBOX_DOMAIN", process.env.INBOX_DOMAIN.trim());
            fs.writeFileSync(p, s);
          '
          grep -q "SUPABASE_URL: \"https://" web/js/config.js
      - name: Install and copy the app into Xcode
        script: |
          npm install --no-audit --no-fund
          npx cap sync ios
      - name: Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build number
        script: |
          #!/usr/bin/env bash
          # Apple needs every upload to have a higher build number than the last one.
          # Take the highest of TestFlight, the App Store and Codemagic's own counter, plus one.
          num() { grep -Eo '[0-9]+' | tail -n 1; }
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | num)
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | num)
          CM=${BUILD_NUMBER:-0}
          NEXT=$(( $(printf '%s\n' "${TF:-0}" "${AS:-0}" "$CM" | sort -n | tail -n 1) + 1 ))
          echo "TestFlight ${TF:-none}, App Store ${AS:-none}, Codemagic $CM. Using build $NEXT"
          cd ios/App && agvtool new-version -all "$NEXT"
      - name: Build
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Builds land in TestFlight for internal testers (you) with no review.
        # External beta review isn't needed: the App Store submission is done by hand.
        submit_to_testflight: false
